version: 2

project_name: gostat

before:
  hooks:
    - go mod tidy
    # A release that cannot pass its own tests should not be cut.
    - go test ./...

builds:
  - id: gostat
    binary: gostat
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath drops the build machine's paths from the binary, which is what
    # the old asmflags and gcflags were reaching for through $GOPATH.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.gostatVersion={{ .Version }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: ghdwlsgur
    name: gostat

# brews (a Homebrew formula) is deprecated: Homebrew wants prebuilt binaries
# distributed as casks. The tap stays the same, and `brew install gostat`
# resolves a cask in a tapped repository just as it did a formula.
homebrew_casks:
  - name: gostat
    binaries:
      - gostat
    homepage: "https://github.com/ghdwlsgur/gostat"
    description: "Send an HTTP GET request to a domain's A record or a pinned edge IP, and measure the response headers and latency at each stage"
    license: "MIT"
    repository:
      owner: ghdwlsgur
      name: homebrew-gostat
    commit_author:
      name: ghdwlsgur
      email: vjinhyeokv@gmail.com
    # Without this the binary keeps the quarantine attribute it inherited from
    # the downloaded archive and Gatekeeper refuses to run it - verified by
    # installing the cask both ways. goreleaser's own hooks field still emits
    # the `postflight` block that Homebrew 7 deprecated, so the replacement
    # stanza is written out here instead.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr",
            args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/gostat"],
            must_succeed: false
      end
