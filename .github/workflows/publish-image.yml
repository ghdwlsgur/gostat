name: Publish image

# Cut from the same tag the binaries are released from, so the image and the
# GitHub release always describe the same commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Pushing to ghcr.io under this repository.
      packages: write
      # Signing the provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # No QEMU: the Dockerfile builds on the runner's own architecture and
      # cross-compiles, so nothing has to be emulated.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.7 publishes 1.2.7, 1.2, 1 and latest. A prerelease tag such as
          # v1.3.0-rc1 publishes only itself, never latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A manual run has no version to name itself after, and the semver
            # rules above only match a tag ref, so it would otherwise push
            # nothing at all. Give it edge plus the commit it came from.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=gostat
            org.opencontainers.image.description=HTTP GET to a domain's A records - or a pinned edge IP - with response headers and per-stage latency. A shorter curl --resolve.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
